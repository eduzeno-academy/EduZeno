backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Website Pages"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Main Heading (Hero Title)", name: "title", widget: "string"}
          - {label: "Subtitle", name: "description", widget: "text"}
          
